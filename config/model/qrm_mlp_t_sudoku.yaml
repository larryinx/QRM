mlp_t: True
pos_encodings: ~

L_layers: 2
H_cycles: 3
L_cycles: 6

# QRM specific
use_fsq: True
fsq_levels: [8, 5, 5, 5]
fsq_top_k: 4
fsq_temperature: 1.0
fsq_residual_mode: fixed
fsq_residual_weight: 1.0   # 1.0 = pure quantization (backward compat)
fsq_pre_norm: False

# Loss weights
lambda_tree: 1.0
lambda_recon: 0.1
lambda_div: 0.01
alpha: 0.5

# Reward weights
em_weight: 0.0
token_acc_weight: 1.0

# Inference parameters
do_sampling: False
halt_max_steps: 16

# MCTS parameters
num_iterations: 64
search_rule: uct
c_uct: 1.414
c_puct: 1.0
terminal_selection_mode: skip_saturated
q_normalize: True